name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-reusable.yml

  adr-lint-gate:
    name: ADR lint gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/adr-lint-gate-test.sh
      - run: scripts/adr-lint-gate.sh
