[package]
name = "adr-fmt"
version = "0.1.0"
description = "ADR template and link-integrity validator"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Mattilsynet/adr-fmt"
documentation = "https://docs.rs/adr-fmt"
readme = "README.md"
authors = ["acje"]
keywords = ["adr", "documentation", "lint", "governance"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".gitignore"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lib]
name = "adr_fmt"
path = "src/lib.rs"

[[bin]]
name = "adr-fmt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
overflow-checks = true
